<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#131314" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lungo" />
  <title>Lungo — AI English Tutor</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="app-layout" id="app-layout">
    <!-- Minimalist Collapsible Sidebar ala Gemini -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button type="button" class="icon-btn" id="close-sidebar-btn" title="Tutup sidebar" aria-label="Tutup sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <button type="button" id="clear-chat-btn" class="new-chat-pill" title="Mulai ulang percakapan di sesi ini">
          <span>＋</span> Percakapan Baru
        </button>
      </div>

      <div class="progress-minimal">
        <div class="progress-header">
          <span>Progres Belajar</span>
          <span id="progress-count-text">0 / 16 Sesi</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
        </div>
      </div>

      <div class="curriculum-section-header">
        <span>Kurikulum Sesi (A1 – C1)</span>
        <button id="reset-progress-btn" class="text-btn" title="Ulang progres dari Sesi 1">Reset</button>
      </div>

      <div class="session-list" id="session-list"></div>
    </aside>

    <!-- Main Minimalist Chat Canvas -->
    <main class="chat-wrapper">
      <!-- Top Bar ala Gemini -->
      <header class="chat-header">
        <div class="header-left">
          <button type="button" class="icon-btn" id="open-sidebar-btn" title="Buka/Tutup Kurikulum" aria-label="Toggle Kurikulum">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand-minimal">
            <span class="brand-name">Lungo</span>
            <span class="session-pill" id="banner-session-badge">Sesi 1 • A1</span>
          </div>
        </div>

        <div class="header-center-topic" id="active-session-header-text">
          Sesi 1: Greetings, Introductions & Subject Pronouns
        </div>

        <div class="header-actions">
          <button type="button" id="install-pwa-btn" class="btn-minimal-action hidden" title="Install aplikasi Lungo ke HP / Laptop">
            📲 Install App
          </button>
          <button type="button" id="complete-session-btn" class="btn-minimal-action" title="Tandai sesi ini selesai dan lanjut ke sesi berikutnya">
            ✓ Selesai & Lanjut Sesi
          </button>
          <button type="button" id="open-live-voice-btn" class="btn-live-minimal" title="Mulai percakapan suara ala Gemini Live">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 2v20M17 6v12M7 6v12M21 10v4M3 10v4" stroke-linecap="round"/>
            </svg>
            <span>Live</span>
          </button>
        </div>
      </header>

      <!-- Hidden metadata elements kept for script compatibility -->
      <div class="sr-only" aria-hidden="true">
        <span id="banner-session-title"></span>
        <span id="banner-session-summary"></span>
        <span id="banner-session-goal"></span>
      </div>

      <!-- Chat Stream (#chat-box) -->
      <div id="chat-box" class="chat-box"></div>

      <!-- Bottom Input Area (Centered Pill + Quick Chips) -->
      <div class="bottom-dock">
        <div class="quick-actions" id="quick-actions">
          <button type="button" class="chip-btn" data-action="study">
            📖 Belajar Materi Sesi Ini
          </button>
          <button type="button" class="chip-btn" data-action="chat">
            💬 Latihan Bercakap-cakap
          </button>
          <button type="button" class="chip-btn" data-action="quiz">
            📝 Kuis Sesi Ini
          </button>
          <button type="button" class="chip-btn" data-action="vocab">
            🔤 Kosakata & Contoh
          </button>
        </div>

        <form id="chat-form" class="chat-form-pill">
          <input
            type="text"
            id="user-input"
            placeholder="Tanya Lungo atau latihan bahasa Inggris..."
            autocomplete="off"
            required
          />
          <div class="pill-tools">
            <button
              type="button"
              id="mic-btn"
              class="pill-icon-btn"
              title="Dikte suara (Voice-to-Text)"
              aria-label="Rekam suara"
            >
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            <button type="submit" id="send-btn" class="pill-send-btn" aria-label="Kirim pesan">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </form>
        <div class="footer-caption">
          Lungo menyimpan progres belajarmu per sesi secara otomatis.
        </div>
      </div>
    </main>
  </div>

  <!-- Minimalist Gemini Live Voice Overlay -->
  <div id="live-voice-overlay" class="live-voice-overlay hidden">
    <div class="live-voice-card">
      <div class="live-voice-top">
        <span class="live-badge" id="live-engine-badge">✦ Lungo Live</span>
        <div class="live-lang-selector">
          <select id="voice-lang-select" aria-label="Pilih Suara AI">
            <option value="Aoede" selected>Aoede (Warm)</option>
            <option value="Kore">Kore (Clear)</option>
            <option value="Puck">Puck (Casual)</option>
            <option value="Fenrir">Fenrir (Calm)</option>
            <option value="Charon">Charon (Crisp)</option>
          </select>
        </div>
      </div>

      <div class="live-orb-wrapper">
        <div id="live-orb" class="live-orb listening">
          <span id="live-orb-icon">✦</span>
        </div>
        <div class="live-ripple r1"></div>
        <div class="live-ripple r2"></div>
      </div>

      <h3 id="live-status-title" class="live-status-title">Mendengarkan...</h3>
      <p id="live-transcript-text" class="live-transcript-text">
        Mulai bicara dalam Bahasa Inggris untuk berlatih bersama Lungo.
      </p>

      <div class="live-controls">
        <button type="button" id="toggle-live-mic-btn" class="live-ctrl-btn" title="Jeda / Lanjutkan Mikrofon">
          🎙️ Jeda / Bicara
        </button>
        <button type="button" id="stop-tts-btn" class="live-ctrl-btn" title="Potong suara Lungo">
          ✋ Potong Suara
        </button>
        <button type="button" id="close-live-voice-btn" class="live-ctrl-btn danger" title="Akhiri sesi Live">
          ✕ Tutup
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
